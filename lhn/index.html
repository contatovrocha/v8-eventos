<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plano LHN · 8ª Edição - Empresarial</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: cabeçalho + barra de progresso geral, filtros e um quadro horizontal com um dia por coluna; o dia de hoje fica mais largo e destacado. */
:root{--g1:#FBE9B5;--g2:#D9AC55;--g3:#94692A;--bg:#060606;--s:#0f0e0c;--s2:#16140f;--ln:#2a241a;--tx:#EFE8D8;--mu:#9a8f78}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:Montserrat,system-ui,sans-serif;overflow:hidden;position:relative}
body:before{content:"";position:fixed;left:50%;top:-55vh;width:130vh;height:130vh;transform:translateX(-50%);border-radius:50%;background:repeating-conic-gradient(from 270deg,rgba(217,172,85,.07) 0 6deg,transparent 6deg 12deg);-webkit-mask-image:radial-gradient(circle,#000 30%,transparent 70%);pointer-events:none}
.app{position:relative;height:100%;display:flex;flex-direction:column;padding:22px max(28px,env(safe-area-inset-right)) 18px max(28px,env(safe-area-inset-left));gap:14px}
.gold{background:linear-gradient(180deg,var(--g1),var(--g2) 55%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:18px}
.logo{font-family:Cinzel,serif;font-weight:700;font-size:44px;letter-spacing:.06em;line-height:1}.logo i{font-style:normal;font-size:.45em;vertical-align:.55em;margin:0 .1em}
.bt h1{font-family:Cinzel,serif;font-weight:700;font-size:22px;letter-spacing:.06em}
.bt p{font-size:11px;letter-spacing:.3em;color:var(--mu);font-weight:600;margin-top:5px}
.cd{display:flex;align-items:center;gap:20px}
.nd{margin-left:12px;font:800 11px Montserrat,sans-serif;letter-spacing:.14em;color:#120c04;background:var(--g2);border:0;padding:8px 12px;cursor:pointer;vertical-align:middle}.nd:hover{background:#f2d38a}
.sheet input[type=date]{color-scheme:dark}
.cd .box{text-align:right}.cd .box b{display:block;font-family:Cinzel,serif;font-size:34px;line-height:1}.cd .box span{font-size:11px;letter-spacing:.28em;color:var(--mu);font-weight:600}
.cd .ev{border:1px solid rgba(217,172,85,.6);padding:10px 16px;font-weight:700;font-size:13px;letter-spacing:.12em;background:rgba(217,172,85,.06);white-space:nowrap}
.prog{padding:14px 20px 34px;background:linear-gradient(180deg,rgba(217,172,85,.06),rgba(217,172,85,.02));border:1px solid var(--ln)}
.pl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:12px}
.pl b{font-size:12px;letter-spacing:.3em;color:var(--mu)}.pl strong{font-family:Cinzel,serif;font-size:26px}.pl em{font-style:normal;font-size:13px;color:var(--mu);margin-left:10px}
.track{position:relative}
.bar{position:relative;height:12px;border-radius:99px;background:#1c1914;border:1px solid var(--ln)}
.fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,#94692A,#D9AC55,#FBE9B5);box-shadow:0 0 18px rgba(217,172,85,.6);transition:width .5s}
.todayMark{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--g1);box-shadow:0 0 10px var(--g1)}
.tk{position:absolute;top:22px;transform:translateX(-50%);font-size:10px;letter-spacing:.12em;color:var(--mu);font-weight:700;white-space:nowrap;cursor:pointer;background:none;border:0;font-family:inherit;padding:2px 4px}
.tk.on{color:var(--g1)}.tk.ev{color:var(--g2)}
.filters{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:7px;font:600 12px Montserrat,sans-serif;padding:6px 12px;border:1px solid var(--ln);border-radius:99px;color:#d8cfbb;background:transparent;cursor:pointer}
.chip i{width:18px;height:18px;border-radius:50%;background:var(--c);color:#120c04;font-style:normal;font-size:10px;font-weight:800;display:grid;place-items:center}
.chip[aria-pressed="true"]{border-color:var(--g2);color:var(--g1);background:rgba(217,172,85,.08)}
.sel{font:600 12px Montserrat,sans-serif;background:#0f0e0c;color:#d8cfbb;border:1px solid var(--ln);border-radius:99px;padding:6px 12px}
.hint{font-size:12px;color:var(--mu)}
.board{flex:1;min-height:0;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;padding-bottom:6px}
.day{flex:1 1 0;min-width:190px;background:var(--s);border:1px solid var(--ln);display:flex;flex-direction:column;opacity:.6;transition:opacity .3s,flex .3s;scroll-snap-align:start}
.day:hover{opacity:.9}
.post{position:relative;border-bottom:1px solid var(--ln);background:#0b0a07}
.post img{display:block;width:100%;height:150px;object-fit:cover;object-position:50% 12%;cursor:zoom-in}
.post .pt{position:absolute;left:8px;top:8px;font-size:10px;font-weight:800;letter-spacing:.14em;color:#120c04;background:var(--g2);padding:3px 7px}
.post .pb{display:flex;gap:6px;padding:7px}
.post a{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font:700 11px Montserrat,sans-serif;letter-spacing:.06em;color:var(--g2);border:1px solid #4a3e28;padding:7px 4px;text-decoration:none}
.post a.ph{all:unset;display:block;cursor:zoom-in}.post .pb a:hover{background:var(--g2);color:#120c04}
.post a svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.day.hoje .post img{height:190px}
.day header{padding:12px 12px 10px;border-bottom:1px solid var(--ln)}
.dh{display:flex;align-items:baseline;gap:8px}.dh b{font-family:Cinzel,serif;font-size:19px}.dh span{font-size:12px;color:var(--mu);font-weight:600}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--g2);font-weight:700;margin-top:5px}
.mini{height:5px;background:#1c1914;border-radius:99px;margin-top:9px;overflow:hidden}.mini i{display:block;height:100%;background:linear-gradient(90deg,#94692A,#D9AC55);transition:width .4s}
.cnt{font-size:11px;color:var(--mu);margin-top:5px}
.bd{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.16em;padding:3px 8px}
.bd.now{background:var(--g2);color:#120c04}.bd.ev{border:1px solid var(--g2);color:var(--g1)}
.cards{padding:9px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;flex:1;min-height:0}
.card{display:flex;gap:9px;padding:9px;background:var(--s2);border:1px solid #221e16;cursor:pointer;text-align:left;width:100%;font-family:inherit;color:inherit;transition:background .2s,border-color .2s}
.card:hover{border-color:#4a3e28}
.card:focus-visible,.chip:focus-visible,.tk:focus-visible{outline:2px solid var(--g2);outline-offset:2px}
.ck{flex:none;width:19px;height:19px;border-radius:50%;border:1.6px solid #5b5240;display:grid;place-items:center;font-size:11px;font-weight:800;color:#120c04;margin-top:1px}
.ct{min-width:0}
.ct p{font-size:12.5px;line-height:1.3;font-weight:500}
.ct small{display:block;font-size:11px;color:var(--mu);margin-top:3px;line-height:1.3}
.meta{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.who{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#cfc5ae}.who i{width:17px;height:17px;border-radius:50%;background:var(--c);color:#120c04;font-style:normal;font-size:9.5px;font-weight:800;display:grid;place-items:center}
.fr{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--g2);border:1px solid rgba(217,172,85,.3);padding:1px 6px}
.card.done .ck{background:var(--g2);border-color:var(--g2)}.card.done p{text-decoration:line-through;color:var(--mu)}.card.done{opacity:.72}
.card.recent{border-color:var(--g2);box-shadow:0 0 0 1px rgba(217,172,85,.35),0 0 22px rgba(217,172,85,.25)}
.who{cursor:pointer;padding:2px 6px 2px 2px;margin:-2px 0 -2px -2px;border-radius:99px;border:1px dashed transparent}.who:hover,.who:focus-visible{border-color:#6b5a38}.who::after{content:"✎";font-size:10px;color:var(--mu);margin-left:2px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet .bx{width:100%;max-width:420px;background:#14120d;border:1px solid #3a3020;border-bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));font-family:Montserrat,sans-serif}
@media(min-width:600px){.sheet{align-items:center}.sheet .bx{border-bottom:1px solid #3a3020}}
.sheet h4{margin:0 0 4px;font-size:12px;letter-spacing:.14em;color:var(--g2)}.sheet .tt{font-size:13px;color:#d8cfbb;margin:0 0 12px}
.sheet .ops{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}.sheet .ops .chip[aria-pressed=true]{border-color:var(--g2);color:#fff}
.sheet form{display:flex;gap:7px}.sheet input{flex:1;min-width:0;background:#0d0b08;border:1px solid var(--ln);color:#fff;font:500 14px Montserrat,sans-serif;padding:9px 10px}
.sheet .ok{background:var(--g2);color:#120c04;border:0;font:700 13px Montserrat,sans-serif;padding:0 14px;cursor:pointer}
.sheet .x{margin-top:10px;width:100%;background:transparent;border:1px solid var(--ln);color:#d8cfbb;font:600 12px Montserrat,sans-serif;padding:9px;cursor:pointer}
.msgb{display:inline-flex;align-items:center;gap:4px;font:700 10.5px Montserrat,sans-serif;letter-spacing:.06em;color:#120c04;background:var(--g2);padding:3px 8px;cursor:pointer}
.msgb svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linejoin:round}
.msgb:hover,.msgb:focus-visible{background:#f2d38a;outline:none}
.sheet .bx.msg{max-width:540px;max-height:90vh;overflow-y:auto}
.sheet .mimg{display:flex;gap:12px;align-items:flex-start;margin:4px 0 14px}
.sheet .mimg img{width:120px;border:1px solid #3a3020;flex:none}
.sheet .mimg div{font-size:12px;color:var(--mu);line-height:1.5}
.sheet .act{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--g2);color:#120c04;border:0;font:700 12px Montserrat,sans-serif;padding:9px 12px;cursor:pointer;text-decoration:none}
.sheet .act.alt{background:transparent;color:var(--g2);border:1px solid #4a3e28}
.sheet .act svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sheet h5{margin:14px 0 6px;font:700 12px Montserrat,sans-serif;letter-spacing:.08em;color:#f3ead6}
.sheet pre{white-space:pre-wrap;word-wrap:break-word;margin:0 0 8px;background:#0d0b08;border:1px solid var(--ln);padding:12px;font:500 13px/1.55 Montserrat,sans-serif;color:#e6dcc4}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet .tip{font-size:11.5px;color:var(--mu);margin:2px 0 4px}
.card.busy{opacity:.5;pointer-events:none}
.day.hoje{flex:1.6 1 0;min-width:270px;opacity:1;border:1.5px solid var(--g2);box-shadow:0 0 0 1px rgba(217,172,85,.25),0 20px 60px -20px rgba(217,172,85,.45);background:linear-gradient(180deg,#17130b,#0f0e0c 40%)}
.day.hoje .dh b{font-size:24px}.day.hoje .ct p{font-size:13.5px}.day.hoje .card{background:#1b1810;border-color:#3a3020}
.day.evento{opacity:.85;border-color:rgba(217,172,85,.55)}
.day.focus{opacity:1}
.empty{font-size:12px;color:var(--mu);padding:8px}
.foot{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.22em;color:var(--mu);gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--g2);color:#120c04;font-weight:700;font-size:13px;padding:10px 16px;z-index:9}
.load{margin:auto;color:var(--mu)}
@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100%;padding:16px max(14px,env(safe-area-inset-right)) 16px max(14px,env(safe-area-inset-left))}
  .logo{font-size:34px}.bt h1{font-size:16px}.cd .ev{display:none}.cd .box b{font-size:26px}
  .board{height:72vh;flex:none}
  .day{min-width:78vw}.day.hoje{min-width:84vw}
  .hint{display:none}
  .tk b{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><div class="logo gold">L<i>•</i>H<i>•</i>N</div><div class="bt"><h1>PLANO DE LANÇAMENTO</h1><p>8ª EDIÇÃO - EMPRESARIAL · TIAGO ALMEIDA</p></div></div>
    <div class="cd"><div class="box"><b class="gold" id="cdN">–</b><span id="cdL">PARA O EVENTO</span></div><div class="ev"><span id="evTxt">QUA 11/11</span> · 19H · ALPHAVILLE · 40 CADEIRAS<button type="button" class="nd" id="novaData">NOVA DATA</button></div></div>
  </div>
  <div class="prog">
    <div class="pl"><b>PROGRESSO GERAL</b><div><strong class="gold" id="pct">0%</strong><em id="pctTxt"></em></div></div>
    <div class="track"><div class="bar"><div class="fill" id="fill" style="width:0"></div><div class="todayMark" id="todayMark"></div></div><div id="ticks"></div></div>
  </div>

    <div class="chips" id="people"></div>

  </div>
  <div class="board" id="board"><div class="load">Carregando o plano…</div></div>
  <div class="foot"><span>NÃO É SOBRE ASSISTIR. É SOBRE PERTENCER.</span><span id="upd"></span></div>
</div>
<script>
const SB='https://hmnhcinkmfwtutkbxejb.supabase.co', KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhtbmhjaW5rbWZ3dHV0a2J4ZWpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3ODM3ODcsImV4cCI6MjEwODM1OTc4N30.WRIigm-qiUAjfwYf7GjwTfJzjH_t8dWCWgFftRE07oo';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
let DAYS=[];
const WD=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
let EVENT_DAY='2026-11-11';
const SEMANA=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
function addDays(d,n){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function tok(txt){if(!txt)return txt;const dt=new Date(EVENT_DAY+'T12:00:00'),w=SEMANA[dt.getDay()];return txt.replace(/\{\{data\}\}/g,EVENT_DAY.slice(8)+'/'+EVENT_DAY.slice(5,7)).replace(/\{\{semana\}\}/g,w).replace(/\{\{Semana\}\}/g,w[0].toUpperCase()+w.slice(1))}
const PEOPLE={Victor:'#D9AC55',Tiago:'#F2D38A',Caio:'#6FA8DC',Cadu:'#5FC48B',Thalita:'#C77DDB',Kael:'#E0915A'};
let tasks=[],who='Todos',front='Todas',busy=new Set();
const $=id=>document.getElementById(id);
const POSTS_REL=[[-3,'lhn-1-3dias','Faltam 3 dias'],[-2,'lhn-2-2dias','Faltam 2 dias'],[-1,'lhn-3-amanha','É amanhã'],[0,'lhn-4-hoje','É hoje!']];let POSTS={};
const DL='<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';
function postCard(d){const p=POSTS[d];if(!p)return '';const b='img/posts/'+p[0];return '<div class="post"><a class="ph" href="'+b+'-feed.jpg" target="_blank" aria-label="Ver post '+p[1]+'"><img src="'+b+'-feed.jpg" alt="Post '+p[1]+'" loading="lazy"></a><span class="pt">POST · '+p[1].toUpperCase()+'</span><div class="pb"><a href="'+b+'-feed.jpg" download>'+DL+'Feed</a><a href="'+b+'-story.jpg" download>'+DL+'Stories</a></div></div>'}
const PAL=['#E0915A','#7FC7C0','#E57A9A','#A6C25A','#8C9BE8','#D6B24A'];
function col(n){if(PEOPLE[n])return PEOPLE[n];let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;return PAL[h%PAL.length]}
function names(){return [...new Set([...Object.keys(PEOPLE),...tasks.map(t=>t.responsavel)])]}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function todayISO(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo'}).format(new Date())}
function focusDay(){const t=todayISO();if(t<DAYS[0])return DAYS[0];if(t>DAYS[DAYS.length-1])return DAYS[DAYS.length-1];return t}
function goDay(d,smooth){const el=document.getElementById('d-'+d),bd=$('board');if(!el)return;bd.scrollTo({left:Math.max(0,el.offsetLeft-bd.offsetLeft-(bd.clientWidth-el.clientWidth)/2),behavior:smooth?'smooth':'auto'})}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
async function load(){const [r,c]=await Promise.all([fetch(SB+'/rest/v1/lhn_agenda?select=*&order=dia.asc,ordem.asc',{headers:H}),fetch(SB+'/rest/v1/lhn_config?select=event_day&id=eq.1',{headers:H})]);if(!r.ok)throw new Error(r.status);tasks=await r.json();
 try{const cf=await c.json();if(cf&&cf[0])EVENT_DAY=cf[0].event_day}catch(_){}
 DAYS=[...new Set(tasks.map(t=>t.dia))].sort();POSTS={};POSTS_REL.forEach(([o,f,l])=>{POSTS[addDays(EVENT_DAY,o)]=[f,l]});
 const dt=new Date(EVENT_DAY+'T12:00:00');$('evTxt').textContent=WD[dt.getDay()]+' '+EVENT_DAY.slice(8)+'/'+EVENT_DAY.slice(5,7);render()}
function pass(t){return (who==='Todos'||t.responsavel===who)&&(front==='Todas'||t.frente===front)}
function render(){
 const fd=focusDay(),today=todayISO();
 const done=tasks.filter(t=>t.feito).length,total=tasks.length,pct=total?Math.round(done/total*100):0;
 $('pct').textContent=pct+'%';$('pctTxt').textContent=done+' de '+total+' tarefas concluídas';$('fill').style.width=Math.max(pct,1)+'%';
 const fi=DAYS.indexOf(fd);$('todayMark').style.left=((fi+.5)/DAYS.length*100)+'%';
 const dleft=Math.round((new Date(EVENT_DAY+'T12:00:00')-new Date(today+'T12:00:00'))/864e5);
 $('cdN').textContent=dleft>1?dleft+' DIAS':dleft===1?'AMANHÃ':dleft===0?'É HOJE':'REALIZADO';$('cdL').textContent=dleft>=0?'PARA O EVENTO':'EVENTO';
 $('ticks').innerHTML=DAYS.map((d,i)=>{const dt=new Date(d+'T12:00:00');return '<button class="tk'+(d===fd?' on':'')+(d===EVENT_DAY?' ev':'')+'" style="left:'+((i+.5)/DAYS.length*100)+'%" data-go="'+d+'">'+WD[dt.getDay()]+' <b>'+d.slice(8)+'</b></button>'}).join('');
 const recent=Date.now()-5*60e3;
 $('board').innerHTML=DAYS.map(d=>{const dt=new Date(d+'T12:00:00');const all=tasks.filter(t=>t.dia===d);const list=all.filter(pass);const dd=all.filter(t=>t.feito).length;const p=all.length?Math.round(dd/all.length*100):0;
  const cls=(d===fd?' hoje':'')+(d===EVENT_DAY?' evento':'');const badge=d===fd&&d===today?'<span class="bd now">HOJE</span>':d===EVENT_DAY?'<span class="bd ev">EVENTO</span>':'';
  return '<section class="day'+cls+'" id="d-'+d+'">'+postCard(d)+'<header><div class="dh"><b>'+WD[dt.getDay()]+'</b><span>'+d.slice(8)+'/'+d.slice(5,7)+'</span>'+badge+'</div><div class="lbl">'+esc(all[0]?.foco||'')+'</div><div class="mini"><i style="width:'+Math.max(p,2)+'%"></i></div><div class="cnt">'+dd+' de '+all.length+' feitas</div></header><div class="cards">'+
  (list.length?list.map(t=>'<button class="card'+(t.feito?' done':'')+(new Date(t.updated_at).getTime()>recent?' recent':'')+(busy.has(t.id)?' busy':'')+'" data-id="'+t.id+'" aria-pressed="'+t.feito+'"><span class="ck">'+(t.feito?'✓':'')+'</span><span class="ct"><p>'+esc(tok(t.titulo))+'</p>'+(t.detalhe?'<small>'+esc(t.detalhe)+'</small>':'')+'<span class="meta"><span class="who" role="button" tabindex="0" title="Trocar responsável" data-resp="'+t.id+'" style="--c:'+col(t.responsavel)+'"><i>'+esc(t.responsavel[0])+'</i>'+esc(t.responsavel)+'</span><span class="fr">'+esc(t.frente)+'</span>'+((t.modelos&&t.modelos.length)?'<span class="msgb" role="button" tabindex="0" title="Ver mensagem para enviar" data-msg="'+t.id+'"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg>Mensagem</span>':'')+'</span></span></button>').join(''):'<div class="empty">Nenhuma tarefa com esse filtro.</div>')+'</div></section>'}).join('');
 $('upd').textContent='ATUALIZADO ÀS '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function buildFilters(){$('people').innerHTML=['Todos',...names()].map(n=>'<button class="chip" data-who="'+esc(n)+'" aria-pressed="'+(n===who)+'" style="--c:'+(n==='Todos'?'#D9AC55':col(n))+'">'+(n==='Todos'?'':'<i>'+esc(n[0])+'</i>')+esc(n)+'</button>').join('');
 const fronts=['Todas',...new Set(tasks.map(t=>t.frente))];$('frente').innerHTML=fronts.map(f=>'<option'+(f===front?' selected':'')+'>'+f+'</option>').join('')}
function copyText(txt){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(txt);const a=document.createElement('textarea');a.value=txt;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}finally{a.remove()}return Promise.resolve()}
function openMsg(id){const t=tasks.find(x=>x.id===id);if(!t||!t.modelos||!t.modelos.length)return;closeSheet();
 const d=document.createElement('div');d.className='sheet';
 const img=t.imagem?'<div class="mimg"><img src="'+esc(t.imagem)+'" alt="Imagem para enviar junto"><div>Imagem para enviar junto com a mensagem.<br><br><a class="act" href="'+esc(t.imagem)+'" download>'+DL+'Baixar imagem</a></div></div>':'';
 d.innerHTML='<div class="bx msg" role="dialog" aria-label="Mensagem da tarefa"><h4>'+esc(t.responsavel.toUpperCase())+' · '+esc(t.frente.toUpperCase())+'</h4><p class="tt">'+esc(tok(t.titulo))+'</p>'+img+'<p class="tip">Troque {{nome}} pelo primeiro nome e {{restantes}} pelo número real de cadeiras livres antes de enviar.</p>'+
  t.modelos.map((m,i)=>'<h5>'+esc(m.titulo)+'</h5><pre>'+esc(tok(m.texto))+'</pre><div class="row"><button type="button" class="act" data-copy="'+i+'"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="1"/><path d="M5 15V4h11"/></svg><span>Copiar</span></button><a class="act alt" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(tok(m.texto))+'">Abrir no WhatsApp</a></div>').join('')+
  '<button type="button" class="x">Fechar</button></div>';
 document.body.appendChild(d);
 d.addEventListener('click',e=>{e.stopPropagation();if(e.target===d||e.target.closest('.x'))return closeSheet();const c=e.target.closest('[data-copy]');if(c){const sp=c.querySelector('span');copyText(tok(t.modelos[+c.dataset.copy].texto)).then(()=>{sp.textContent='Copiado!';toast('Mensagem copiada');setTimeout(()=>{sp.textContent='Copiar'},1800)}).catch(()=>toast('Não deu para copiar. Selecione o texto.'))}})}
function openNovaData(){closeSheet();const d=document.createElement('div');d.className='sheet';
 d.innerHTML='<div class="bx" role="dialog" aria-label="Nova data do evento"><h4>NOVA DATA DO EVENTO</h4><p class="tt">Hoje o evento está em '+EVENT_DAY.slice(8)+'/'+EVENT_DAY.slice(5,7)+'. Toda a agenda e as mensagens de disparo se ajustam à nova data, mantendo os mesmos dias antes e depois do evento.</p><form><input type="date" required value="'+EVENT_DAY+'" aria-label="Nova data"><button class="ok">Atualizar</button></form><button type="button" class="x">Cancelar</button></div>';
 document.body.appendChild(d);d.addEventListener('click',e=>{e.stopPropagation();if(e.target===d||e.target.closest('.x'))closeSheet()});
 d.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const v=d.querySelector('input').value;if(!v||v===EVENT_DAY)return closeSheet();
  if(!confirm('Mudar o evento para '+v.slice(8)+'/'+v.slice(5,7)+'/'+v.slice(0,4)+'? Todas as tarefas serão movidas junto.'))return;
  try{const r=await fetch(SB+'/rest/v1/rpc/lhn_nova_data',{method:'POST',headers:H,body:JSON.stringify({p_data:v})});if(!r.ok)throw 0;closeSheet();await load();buildFilters();setTimeout(()=>goDay(focusDay(),true),50);toast('Evento movido para '+v.slice(8)+'/'+v.slice(5,7))}
  catch(_){toast('Não deu para salvar. Tente de novo.')}})}
function closeSheet(){const s=document.querySelector('.sheet');if(s)s.remove()}
function openSheet(id){const t=tasks.find(x=>x.id===id);if(!t)return;closeSheet();
 const d=document.createElement('div');d.className='sheet';d.innerHTML='<div class="bx" role="dialog" aria-label="Trocar responsável"><h4>RESPONSÁVEL</h4><p class="tt">'+esc(t.titulo)+'</p><div class="ops">'+names().map(n=>'<button type="button" class="chip" data-pick="'+esc(n)+'" aria-pressed="'+(n===t.responsavel)+'" style="--c:'+col(n)+'"><i>'+esc(n[0])+'</i>'+esc(n)+'</button>').join('')+'</div><form><input maxlength="30" placeholder="Novo responsável (nome)" aria-label="Novo responsável"><button class="ok">Salvar</button></form><button type="button" class="x">Cancelar</button></div>';
 document.body.appendChild(d);
 d.addEventListener('click',e=>{e.stopPropagation();if(e.target===d||e.target.closest('.x'))return closeSheet();const k=e.target.closest('[data-pick]');if(k)setResp(t,k.dataset.pick)});
 d.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const v=d.querySelector('input').value.trim().replace(/\s+/g,' ');if(v.length<2)return toast('Digite o nome do responsável');setResp(t,v.replace(/(^|\s)\S/g,m=>m.toUpperCase()))})}
async function setResp(t,n){closeSheet();if(n===t.responsavel)return;const old=t.responsavel;busy.add(t.id);t.responsavel=n;t.updated_at=new Date().toISOString();buildFilters();render();
 try{const r=await fetch(SB+'/rest/v1/rpc/lhn_agenda_responsavel',{method:'POST',headers:H,body:JSON.stringify({p_id:t.id,p_resp:n})});if(!r.ok)throw 0;toast('Responsável: '+n)}
 catch(_){t.responsavel=old;toast('Não deu para salvar. Tente de novo.')}
 busy.delete(t.id);buildFilters();render()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();const mg=e.target.closest&&e.target.closest('.msgb');if(mg&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopPropagation();openMsg(+mg.dataset.msg);return}const w=e.target.closest&&e.target.closest('.who');if(w&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopPropagation();openSheet(+w.dataset.resp)}},true);
document.addEventListener('click',async e=>{
 const mg=e.target.closest('.msgb[data-msg]');if(mg){openMsg(+mg.dataset.msg);return}
 if(e.target.closest('#novaData')){openNovaData();return}
 const w=e.target.closest('.who[data-resp]');if(w){openSheet(+w.dataset.resp);return}
 const c=e.target.closest('.chip');if(c){who=c.dataset.who;buildFilters();render();return}
 const g=e.target.closest('[data-go]');if(g){goDay(g.dataset.go,true);return}
 const b=e.target.closest('.card');if(!b)return;const id=+b.dataset.id;const t=tasks.find(x=>x.id===id);if(!t||busy.has(id))return;
 const novo=!t.feito;busy.add(id);t.feito=novo;t.updated_at=new Date().toISOString();render();
 try{const r=await fetch(SB+'/rest/v1/rpc/lhn_agenda_marcar',{method:'POST',headers:H,body:JSON.stringify({p_id:id,p_feito:novo})});if(!r.ok)throw 0;toast(novo?'Tarefa marcada como feita':'Tarefa voltou para a fazer')}
 catch(_){t.feito=!novo;toast('Não deu para salvar. Tente de novo.')}
 busy.delete(id);render()});
$('frente').addEventListener('change',e=>{front=e.target.value;render()});
(async()=>{try{await load();buildFilters();render();setTimeout(()=>goDay(focusDay(),false),50)}catch(_){$('board').innerHTML='<div class="load">Não foi possível carregar o plano. Recarregue a página.</div>'}
 setInterval(()=>{if(!busy.size&&!document.hidden)load().then(buildFilters).catch(()=>{})},20000)})();
</script>
</body>
</html>
