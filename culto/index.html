<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fundo Culto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=Inter:wght@400;500&display=swap">
<style>
/* Layout: tela cheia de luz (WebGL), texto opcional no centro, um painel que some sozinho. */
:root {
  --ink: #f7f3ef;
  --ink-dim: rgba(247, 243, 239, .62);
  --panel: rgba(12, 10, 12, .62);
  --panel-line: rgba(255, 255, 255, .12);
  --field: rgba(255, 255, 255, .07);
  --focus: #ffe2c4;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Sora", "Inter", system-ui, sans-serif;
  --text-scale: 1;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: #050404; overflow: hidden; }
body { font-family: var(--font-ui); color: var(--ink); }
body.idle { cursor: none; }
canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

/* ---- texto central ---- */
.stage {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.copy {
  max-width: min(92vw, 1400px);
  text-align: center;
  display: grid; gap: calc(1.2vw * var(--text-scale));
  transition: opacity 1.2s ease, filter 1.2s ease, transform 1.2s ease;
}
.stage[data-on="false"] .copy { opacity: 0; filter: blur(14px); transform: scale(.98); }
.headline {
  margin: 0;
  font-family: var(--font-display); font-weight: 600;
  font-size: calc(clamp(2.2rem, 6.4vw, 9rem) * var(--text-scale));
  line-height: 1.04; letter-spacing: -.02em;
  text-wrap: balance;
  text-shadow: 0 0 40px rgba(255,255,255,.18), 0 2px 30px rgba(0,0,0,.35);
}
.sub {
  margin: 0;
  font-family: var(--font-display); font-weight: 300;
  font-size: calc(clamp(1rem, 2.2vw, 3rem) * var(--text-scale));
  line-height: 1.35; letter-spacing: .01em;
  color: rgba(247, 243, 239, .86);
  text-wrap: balance;
  text-shadow: 0 2px 24px rgba(0,0,0,.4);
}
.sub:empty, .headline:empty { display: none; }

/* ---- painel ---- */
.dock {
  position: fixed;
  right: calc(20px + env(safe-area-inset-right, 0px));
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  left: calc(16px + env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  pointer-events: none;
  transition: opacity .6s ease, transform .6s ease;
}
body.idle .dock { opacity: 0; transform: translateY(12px); }
body.idle .dock * { pointer-events: none !important; }
.dock > * { pointer-events: auto; }

.bar, .editor {
  background: var(--panel);
  border: 1px solid var(--panel-line);
  backdrop-filter: blur(16px) saturate(1.3);
  -webkit-backdrop-filter: blur(16px) saturate(1.3);
}
.bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end;
  padding: 10px 12px; border-radius: 999px; max-width: 100%;
}
.swatch, .picker, .btn {
  width: 34px; height: 34px; border-radius: 50%;
  border: 2px solid transparent; padding: 0; cursor: pointer; outline-offset: 3px;
}
.swatch { background: var(--c); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); transition: transform .2s ease; }
.swatch:hover { transform: scale(1.12); }
.swatch[aria-pressed="true"] { border-color: var(--ink); }
.swatch:focus-visible, .btn:focus-visible, .picker:focus-within, .field:focus-visible, .switch input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.picker {
  position: relative; overflow: hidden;
  background: conic-gradient(#ff3b30, #ff9500, #ffcc00, #34c759, #00c7be, #007aff, #af52de, #ff2d55, #ff3b30);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
}
.picker input { position: absolute; inset: -8px; width: 150%; height: 150%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.sep { width: 1px; height: 22px; background: var(--panel-line); }
.btn { background: transparent; color: var(--ink-dim); display: grid; place-items: center; font: 600 14px/1 var(--font-display); }
.btn:hover, .btn[aria-expanded="true"] { color: var(--ink); background: rgba(255,255,255,.1); }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.editor {
  width: min(380px, 100%);
  border-radius: 18px; padding: 16px;
  display: grid; gap: 12px;
}
.editor-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.editor-head strong { font: 500 13px/1 var(--font-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim); }
.editor label.lbl { display: grid; gap: 6px; font-size: 12px; color: var(--ink-dim); letter-spacing: .02em; }
.field {
  width: 100%; box-sizing: border-box;
  background: var(--field); color: var(--ink);
  border: 1px solid var(--panel-line); border-radius: 10px;
  padding: 10px 12px; font: 400 15px/1.35 var(--font-ui);
  resize: vertical;
}
.field::placeholder { color: rgba(247,243,239,.35); }
.row { display: flex; align-items: center; gap: 10px; }
.row input[type="range"] { flex: 1; accent-color: var(--ink); }

.switch { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--ink); }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch span { width: 40px; height: 22px; border-radius: 999px; background: rgba(255,255,255,.18); position: relative; transition: background .25s ease; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); transition: transform .25s ease; }
.switch input:checked + span { background: rgba(255,255,255,.55); }
.switch input:checked + span::after { transform: translateX(18px); background: #111; }

.hint {
  position: fixed;
  left: calc(20px + env(safe-area-inset-left, 0px));
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  font-size: 12px; letter-spacing: .04em; color: var(--ink-dim);
  transition: opacity .6s ease;
}
body.idle .hint, body.editing .hint { opacity: 0; }
@media (max-width: 900px) { .hint { display: none; } }
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>

<div class="stage" id="stage" data-on="false">
  <div class="copy">
    <h1 class="headline" id="outHead"></h1>
    <p class="sub" id="outSub"></p>
  </div>
</div>

<div class="dock">
  <form class="editor" id="editor" hidden>
    <div class="editor-head">
      <strong>Texto na tela</strong>
      <label class="switch" for="showText">
        <input type="checkbox" id="showText">
        <span aria-hidden="true"></span>
        Mostrar
      </label>
    </div>
    <label class="lbl" for="inHead">Headline
      <input class="field" id="inHead" type="text" placeholder="Ex.: Bem-vindos à casa" autocomplete="off">
    </label>
    <label class="lbl" for="inSub">Subheadline
      <textarea class="field" id="inSub" rows="2" placeholder="Ex.: Culto de Celebração · Domingo, 19h"></textarea>
    </label>
    <label class="lbl" for="size">Tamanho do texto
      <span class="row"><input type="range" id="size" min="0.6" max="1.6" step="0.05" value="1"></span>
    </label>
  </form>

  <div class="bar" role="toolbar" aria-label="Controles do fundo">
    <button class="swatch" id="c1" style="--c:#f2260f" data-color="#f2260f" aria-label="Vermelho" aria-pressed="false"></button>
    <button class="swatch" id="c2" style="--c:#f07a2a" data-color="#f07a2a" aria-label="Laranja" aria-pressed="false"></button>
    <button class="swatch" id="c3" style="--c:#d4a548" data-color="#d4a548" aria-label="Dourado" aria-pressed="false"></button>
    <button class="swatch" id="c4" style="--c:#3a9e8f" data-color="#3a9e8f" aria-label="Verde-água" aria-pressed="false"></button>
    <button class="swatch" id="c5" style="--c:#2f6fd8" data-color="#2f6fd8" aria-label="Azul" aria-pressed="false"></button>
    <button class="swatch" id="c6" style="--c:#8a4bf0" data-color="#8a4bf0" aria-label="Roxo" aria-pressed="false"></button>
    <label class="picker" title="Escolher qualquer cor">
      <input type="color" id="custom" value="#e0301e" aria-label="Escolher qualquer cor">
    </label>
    <span class="sep" aria-hidden="true"></span>
    <button class="btn" id="textBtn" type="button" aria-expanded="false" aria-controls="editor" title="Texto (T liga/desliga)">Aa</button>
    <button class="btn" id="fs" type="button" aria-label="Tela cheia" title="Tela cheia (F)">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</div>
<div class="hint">1–6 trocam a cor · T mostra o texto · F tela cheia</div>

<script>
(() => {
  const canvas = document.getElementById('bg');
  const gl = canvas.getContext('webgl', { antialias: false });

  const vert = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }`;
  const frag = `
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform vec3 uColor;

float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f*f*(3.-2.*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+1.), f.x), f.y);
}
float fbm(vec2 p){
  float v = 0., a = .5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for(int i=0;i<4;i++){ v += a*noise(p); p = m*p; a *= .5; }
  return v;
}
vec3 hueRot(vec3 c, float a){
  const vec3 k = vec3(.57735);
  float ca = cos(a);
  return c*ca + cross(k, c)*sin(a) + k*dot(k, c)*(1.-ca);
}
float blob(vec2 p, vec2 c, vec2 r){ vec2 d = (p - c)/r; return exp(-dot(d,d)); }
float gband(float d, float w){ return exp(-d*d/(w*w)); }

// ---------- CENA A: a onda (foto laranja) ----------
vec3 sceneWave(vec2 p, float t, vec3 c, float pulse){
  vec3 dusk = mix(c, vec3(.6, .45, .4), .4) * .55;           // topo cinza-bege
  vec3 hot  = clamp(hueRot(c, .2)*1.2 + vec3(.1, .05, .0), 0., 1.); // laranja-amarelo quente
  vec3 body = mix(c, dusk, .35);                                  // meio terroso

  float x = p.x;
  float y = -.22 + .34*sin(x*2.5 + t*.10 + .9) + .07*sin(x*3.7 - t*.08 + 2.)
          + (fbm(vec2(x*.6, t*.04)) - .5)*.18;
  float y2 = -.22 + .34*sin((x+.01)*2.5 + t*.10 + .9) + .07*sin((x+.01)*3.7 - t*.08 + 2.)
          + (fbm(vec2((x+.01)*.6, t*.04)) - .5)*.18;
  float sl = (y2 - y)/.01;
  float sd = (p.y - y)/sqrt(1. + sl*sl);   // >0 acima da onda

  // acima: cortina de luz que vai do quente (perto da onda) ao cinza (topo)
  float up = max(sd, 0.);
  vec3 above = mix(body*1.05, dusk, smoothstep(.05, .85, up));
  above = mix(hot*.9, above, smoothstep(0., .28, up));
  above *= .62 + .38*exp(-up*1.6);
  // abaixo: cai rápido para o preto
  float dn = max(-sd, 0.);
  vec3 below = mix(c*.75, c*.04, smoothstep(0., .22, dn));

  vec3 col = sd > 0. ? above : below;
  // costura suave entre os lados (sem linha dura)
  col = mix(below, above, smoothstep(-.06, .06, sd));

  // a própria onda: faixa larga e desfocada, mais grossa à esquerda
  float w = mix(.2, .1, smoothstep(-1.2, 1.2, x)) * (.85 + .3*noise(vec2(x*1.5, t*.07)));
  col += mix(c, hot, .5) * gband(sd + .03, w) * .9 * pulse;
  col += hot * gband(sd + .02, w*.5) * .35 * pulse;

  // ponto quente à esquerda
  col += hot * blob(p, vec2(-.95 + .08*sin(t*.05), -.05 + .12*sin(t*.037)), vec2(.42, .55)) * .85 * pulse;
  // canto direito inferior em preto
  col *= 1. - .9*blob(p, vec2(.85 + .1*sin(t*.03), -.6), vec2(.55, .6));
  // canto superior esquerdo mais escuro e acinzentado
  col *= 1. - .45*blob(p, vec2(-1.0, .75), vec2(.6, .45));
  return col;
}

// ---------- CENA B: as faixas (foto azul) ----------
vec3 sceneBands(vec2 p, float t, vec3 c, float pulse){
  vec3 deep  = c*.07 + vec3(.006, .008, .014);       // marinho quase preto
  vec3 mid   = c*.55;
  vec3 light = mix(c, vec3(.93, .95, .94), .62);       // centro quase branco

  vec2 q = p + (vec2(fbm(p*.8 + t*.02), fbm(p*.8 - t*.018 + 3.)) - .5)*.45;
  vec3 col = deep;

  // faixa de cima, atravessando para a direita
  float y1 = .55 + .1*sin(q.x*1.4 + t*.07) + .04*sin(q.x*3. - t*.05);
  col += mid * gband(q.y - y1, .2) * smoothstep(-.9, .2, q.x) * 1.0;
  // faixa do meio, saindo da direita
  float y2 = -.12 + .08*sin(q.x*1.2 - t*.06 + 1.);
  col += mix(mid, light, .25) * gband(q.y - y2, .19) * smoothstep(-.1, .9, q.x) * 1.15 * (.75 + .25*pulse);
  // névoa média ao redor do brilho
  col += mid * blob(q, vec2(-.8 + .06*sin(t*.04), -.05 + .1*sin(t*.03)), vec2(.75, .6)) * .9;
  // brilho quase branco à esquerda
  col += light * blob(q, vec2(-1.05 + .06*sin(t*.05), -.02 + .12*sin(t*.033)), vec2(.5, .6)) * 1.35 * pulse;
  // bolsões escuros
  col *= 1. - .75*blob(q, vec2(.25 + .2*sin(t*.03), .2), vec2(.65, .2));
  col *= 1. - .6*blob(q, vec2(.6, -.6 + .1*cos(t*.04)), vec2(.7, .3));
  return col;
}

// ---------- CENA C: a colina de luz (foto vermelha) ----------
vec3 sceneHill(vec2 p, float t, vec3 c, float pulse){
  vec3 sat    = clamp(c*1.25, 0., 1.);
  vec3 maroon = hueRot(c, -.12)*.2;                                // vinho profundo
  vec3 orange = clamp(hueRot(c, .3)*1.3 + vec3(.06, .02, 0.), 0., 1.); // laranja vivo
  vec3 amber  = clamp(hueRot(c, .5)*1.35 + vec3(.12, .06, 0.), 0., 1.); // miolo amarelo-laranja
  vec3 blush  = mix(c, vec3(1., .96, .94), .7);                    // luz rosada quase branca

  vec2 q = p + (vec2(fbm(p*.7 + t*.02), fbm(p*.7 - t*.02 + 5.)) - .5)*.25;
  float x = q.x;
  // linha da colina: sobe da esquerda, pico perto do centro, desce suave para a direita
  float peakX = -.2 + .25*sin(t*.04);
  float hy = -.12 + .16*exp(-pow((x - peakX)*1.6, 2.)) - .1*(x - peakX) + .03*sin(x*2. + t*.09);
  float sd = q.y - hy;            // >0 acima da colina

  // ---- céu (acima) ----
  vec3 sky = mix(sat*.75, maroon*1.2, smoothstep(-.4, .9, q.x + q.y*.9));       // vermelho -> vinho no canto
  sky += orange * blob(q, vec2(peakX - .05, hy + .15), vec2(.6, .45)) * .75 * pulse;  // brilho laranja
  sky += amber  * blob(q, vec2(peakX + .1, hy + .05), vec2(.3, .2)) * .55 * pulse; // miolo
  sky += blush  * blob(q, vec2(1.0 + .1*sin(t*.05), hy - .04), vec2(.45, .25)) * .8 * pulse; // luz atrás da colina
  sky *= 1. - .65*blob(q, vec2(1.0, .75), vec2(.75, .55));                       // canto superior direito escuro

  // ---- colina (abaixo) ----
  float dn = max(-sd, 0.);
  vec3 hill = mix(sat*1.05, maroon, smoothstep(-.6, .9, q.x - q.y*.3 + dn*.6)); // laranja-vermelho à esquerda, vinho à direita
  hill += orange * blob(q, vec2(-1.0, -.35), vec2(.5, .65)) * .6;
  hill *= .75 + .25*exp(-dn*2.5);
  // borda da colina iluminada por trás
  hill += mix(sat, blush, .3) * exp(-dn/.05) * .35 * pulse;

  return mix(hill, sky, smoothstep(-.025, .05, sd));
}

void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 p = (frag - .5*uRes) / min(uRes.x, uRes.y);
  float t = uTime;
  vec3 c = uColor;

  // brilho de cinema: sobe e desce devagar, com picos ocasionais
  float pulse = .82 + .14*sin(t*.33) + .06*sin(t*.71 + 1.3) + pow(noise(vec2(t*.08, 7.3)), 3.)*1.1;

  // alterna entre as duas cenas com uma fusão longa e suave (~2 min por ciclo)
  // três cenas em ciclo (~45s cada, com fusão longa): colina, onda, faixas
  float cyc = mod(t/45., 3.);
  float dC = min(abs(cyc - 0.), 3. - abs(cyc - 0.));
  float dW = min(abs(cyc - 1.), 3. - abs(cyc - 1.));
  float dB = min(abs(cyc - 2.), 3. - abs(cyc - 2.));
  float wC = smoothstep(.85, .25, dC), wW = smoothstep(.85, .25, dW), wB = smoothstep(.85, .25, dB);
  float ws = wC + wW + wB + 1e-4;
  vec3 col = vec3(0.);
  if (wC > .001) col += sceneHill(p, t, c, pulse) * wC;
  if (wW > .001) col += sceneWave(p, t, c, pulse) * wW;
  if (wB > .001) col += sceneBands(p, t, c, pulse) * wB;
  col /= ws;

  // feixes grossos de luz: faixas largas e desfocadas que acendem e apagam
  vec3 beamCol = mix(c, vec3(1.), .35);
  for (int i = 0; i < 3; i++) {
    float fi = float(i);
    float ang = -.75 + fi*.55 + .12*sin(t*.03 + fi*2.);
    vec2 dir = vec2(cos(ang), sin(ang));
    vec2 nrm = vec2(-dir.y, dir.x);
    float off = -.35 + fi*.45 + .25*sin(t*.045 + fi*1.7);
    float d = dot(p, nrm) - off;
    float along = dot(p, dir);
    float width = .16 + .07*sin(t*.07 + fi*3.);
    float on = smoothstep(.15, .85, .5 + .5*sin(t*(.16 + fi*.05) + fi*2.4)); // acende e apaga
    float fade = smoothstep(1.6, -.2, along + .3*fi) * (.6 + .4*noise(vec2(along*1.5 - t*.2, fi*9.)));
    col += beamCol * gband(d, width) * fade * on * .22 * pulse;
  }

  // vinheta
  vec2 uv = frag/uRes;
  col *= .45 + .55*smoothstep(1.25, .3, length((uv - .5)*vec2(1.1, 1.)));

  // tone map suave
  col = 1. - exp(-col*1.6*(.9 + .1*pulse));
  // saturação exagerada
  float lum = dot(col, vec3(.299, .587, .114));
  col = max(mix(vec3(lum), col, 1.45), 0.);

  // granulado de filme
  float g = hash(frag + fract(t*7.13)*vec2(91.7, 37.3)) - .5;
  col += g*.07;

  gl_FragColor = vec4(clamp(col, 0., 1.), 1.);
}`;

  // ---- WebGL com recuperação automática ----
  let prog, uRes, uTime, uColor, glReady = false;
  function initGL() {
    glReady = false;
    if (!gl || gl.isContextLost()) return false;
    const sh = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
      return s;
    };
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vert));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, frag));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return false;
    gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'a');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    uRes = gl.getUniformLocation(prog, 'uRes');
    uTime = gl.getUniformLocation(prog, 'uTime');
    uColor = gl.getUniformLocation(prog, 'uColor');
    glReady = true;
    resize();
    return true;
  }

  function resize() {
    if (!glReady) return;
    // a imagem é toda desfocada: meia resolução fica igual na tela e alivia muito a placa de vídeo
    let w = Math.round(innerWidth * .6), h = Math.round(innerHeight * .6);
    const k = Math.min(1, 1280 / Math.max(w, h));
    w = Math.max(2, Math.round(w * k)); h = Math.max(2, Math.round(h * k));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, w, h);
    gl.uniform2f(uRes, w, h);
  }
  addEventListener('resize', resize);

  if (!gl) {
    document.body.style.background = 'radial-gradient(circle at 35% 45%, #ff9a1f, #f2260f 35%, #3a0208 85%)';
  } else {
    canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); glReady = false; }, false);
    canvas.addEventListener('webglcontextrestored', () => { initGL(); }, false);
    initGL();
  }

  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k, v); } catch(e){} }
  };

  // ---- cor ----
  const hex2rgb = h => { const n = parseInt(h.slice(1), 16); return [(n>>16&255)/255, (n>>8&255)/255, (n&255)/255]; };
  const swatches = [...document.querySelectorAll('.swatch')];
  const custom = document.getElementById('custom');
  let target = hex2rgb('#f2260f'), current = target.slice();
  function setColor(hex, save = true) {
    if (!/^#[0-9a-f]{6}$/i.test(hex)) return;
    target = hex2rgb(hex);
    custom.value = hex.toLowerCase();
    swatches.forEach(s => s.setAttribute('aria-pressed', String(s.dataset.color.toLowerCase() === hex.toLowerCase())));
    if (save) store.set('culto-cor', hex);
  }
  setColor(store.get('culto-cor') || '#f2260f', false);
  current = target.slice();
  swatches.forEach(s => s.addEventListener('click', () => setColor(s.dataset.color)));
  custom.addEventListener('input', e => setColor(e.target.value));

  // ---- texto ----
  const editor = document.getElementById('editor');
  const textBtn = document.getElementById('textBtn');
  const stage = document.getElementById('stage');
  const inHead = document.getElementById('inHead');
  const inSub = document.getElementById('inSub');
  const showText = document.getElementById('showText');
  const size = document.getElementById('size');
  const outHead = document.getElementById('outHead');
  const outSub = document.getElementById('outSub');

  inHead.value = store.get('culto-head') ?? 'Bem-vindos à casa';
  inSub.value = store.get('culto-sub') ?? 'Culto de Celebração · Domingo, 19h';
  showText.checked = store.get('culto-show') === '1';
  size.value = store.get('culto-size') || '1';

  function renderText() {
    outHead.textContent = inHead.value.trim();
    outSub.textContent = inSub.value.trim();
    stage.dataset.on = String(showText.checked);
    document.documentElement.style.setProperty('--text-scale', size.value);
    store.set('culto-head', inHead.value);
    store.set('culto-sub', inSub.value);
    store.set('culto-show', showText.checked ? '1' : '0');
    store.set('culto-size', size.value);
  }
  [inHead, inSub, size].forEach(el => el.addEventListener('input', renderText));
  showText.addEventListener('change', renderText);
  editor.addEventListener('submit', e => e.preventDefault());
  renderText();

  function toggleEditor(open = editor.hidden) {
    editor.hidden = !open;
    textBtn.setAttribute('aria-expanded', String(open));
    document.body.classList.toggle('editing', open);
    if (open) inHead.focus();
  }
  textBtn.addEventListener('click', () => toggleEditor());

  // ---- tela cheia ----
  function toggleFS() {
    try {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
      else document.exitFullscreen?.().catch(() => {});
    } catch (e) {}
  }
  document.getElementById('fs').addEventListener('click', toggleFS);

  function toggleTextOnScreen() { showText.checked = !showText.checked; renderText(); }

  // ao entrar em tela cheia: fecha o editor e tira o cursor dos campos, para os atalhos funcionarem
  document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement) {
      toggleEditor(false);
      document.activeElement?.blur?.();
      document.body.classList.add('idle');
    }
  });

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const typing = e.target.matches?.('input[type="text"], textarea');
    if (e.key === 'Escape') { toggleEditor(false); document.activeElement?.blur?.(); return; }
    // em tela cheia o T sempre apresenta/esconde o texto, mesmo com o cursor num campo
    if (typing && !(document.fullscreenElement && e.code === 'KeyT')) { wake(); return; }
    const quiet = !!document.fullscreenElement; // no telão os atalhos não fazem os controles aparecerem
    if (e.code === 'KeyT') { e.preventDefault(); toggleTextOnScreen(); }
    else if (e.code === 'KeyF') { e.preventDefault(); toggleFS(); }
    else {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= swatches.length) setColor(swatches[n-1].dataset.color);
      else if (!quiet) wake();
      return;
    }
    if (!quiet) wake();
  }, true);

  // ---- controles somem depois de 3s parado ----
  let idleTimer;
  const dock = document.querySelector('.dock');
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      const busy = dock.matches(':hover') || dock.contains(document.activeElement) && document.activeElement !== document.body && !editor.hidden;
      if (busy) wake(); else document.body.classList.add('idle');
    }, 3000);
  }
  ['mousemove', 'pointerdown', 'touchstart'].forEach(ev => addEventListener(ev, wake, { passive: true }));
  wake();

  async function keepAwake() { try { await navigator.wakeLock?.request('screen'); } catch (e) {} }
  keepAwake();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });

  // ---- loop (roda enquanto a guia estiver aberta) ----
  if (!gl) return;
  const speed = matchMedia('(prefers-reduced-motion: reduce)').matches ? .3 : 1;
  let last = performance.now(), time = (typeof window.__t === "number") ? window.__t : 0;
  let lastFrameAt = performance.now(), rafId = 0;
  function frame(now) {
    rafId = requestAnimationFrame(frame); // agenda o próximo antes, para um erro nunca parar a animação
    lastFrameAt = performance.now();
    try {
      const dt = Math.min(.1, Math.max(0, (now - last) / 1000)); last = now;
      time += dt * speed;
      if (time > 86400) time -= 86400; // evita perda de precisão em sessões muito longas
      const k = 1 - Math.exp(-dt * 2);
      for (let i = 0; i < 3; i++) current[i] += (target[i] - current[i]) * k;
      if (!glReady) return;
      gl.uniform1f(uTime, time);
      gl.uniform3f(uColor, current[0], current[1], current[2]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    } catch (err) { console.error(err); }
  }
  rafId = requestAnimationFrame(frame);

  // vigia: se a animação parar ou o WebGL cair, recupera sozinho
  let failures = 0;
  setInterval(() => {
    if (document.hidden) return;
    const stalled = performance.now() - lastFrameAt > 4000;
    const lost = gl.isContextLost();
    if (!stalled && !lost && glReady) { failures = 0; return; }
    failures++;
    if (stalled) { cancelAnimationFrame(rafId); last = performance.now(); rafId = requestAnimationFrame(frame); }
    if (!lost && !glReady) initGL();
    if (failures >= 5) location.reload(); // último recurso, ~10s sem conseguir desenhar
  }, 2000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { last = performance.now(); if (!glReady && !gl.isContextLost()) initGL(); }
  });
})();
</script>
</body>
</html>
