<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<title>Fundo Culto</title>
<style>
/* Layout: uma tela cheia de shader; um único painel de cor que some sozinho para o telão. */
:root {
  --ink: #f6ece6;
  --ink-dim: rgba(246, 236, 230, .62);
  --panel: rgba(18, 6, 6, .58);
  --panel-line: rgba(255, 255, 255, .12);
  --focus: #ffd9b8;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: #0a0202; overflow: hidden; }
body { font-family: var(--font-ui); color: var(--ink); cursor: default; }
body.idle { cursor: none; }
canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

.panel {
  position: fixed;
  right: calc(20px + env(safe-area-inset-right, 0px));
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100vw - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end;
  padding: 10px 12px;
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-radius: 999px;
  backdrop-filter: blur(14px) saturate(1.3);
  -webkit-backdrop-filter: blur(14px) saturate(1.3);
  transition: opacity .6s ease, transform .6s ease;
}
body.idle .panel { opacity: 0; transform: translateY(12px); pointer-events: none; }

.swatch, .picker, .btn {
  width: 34px; height: 34px; border-radius: 50%;
  border: 2px solid transparent; padding: 0; cursor: pointer;
  outline-offset: 3px;
}
.swatch { background: var(--c); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); transition: transform .2s ease; }
.swatch:hover { transform: scale(1.12); }
.swatch[aria-pressed="true"] { border-color: var(--ink); }
.swatch:focus-visible, .btn:focus-visible, .picker:focus-within { outline: 2px solid var(--focus); }

.picker {
  position: relative; overflow: hidden;
  background: conic-gradient(#ff3b30, #ff9500, #ffcc00, #34c759, #00c7be, #007aff, #af52de, #ff2d55, #ff3b30);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
}
.picker input { position: absolute; inset: -8px; width: 150%; height: 150%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.sep { width: 1px; height: 22px; background: var(--panel-line); }
.btn {
  background: transparent; color: var(--ink-dim);
  display: grid; place-items: center;
}
.btn:hover { color: var(--ink); background: rgba(255,255,255,.08); }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.hint {
  position: fixed;
  left: calc(20px + env(safe-area-inset-left, 0px));
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  font-size: 12px; letter-spacing: .04em; color: var(--ink-dim);
  transition: opacity .6s ease;
}
body.idle .hint { opacity: 0; }
@media (max-width: 640px) { .hint { display: none; } }
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>

<div class="panel" role="toolbar" aria-label="Cor do fundo">
  <button class="swatch" id="c1" style="--c:#d2141c" data-color="#d2141c" aria-label="Vermelho" aria-pressed="false"></button>
  <button class="swatch" id="c2" style="--c:#e8590c" data-color="#e8590c" aria-label="Laranja" aria-pressed="false"></button>
  <button class="swatch" id="c3" style="--c:#c99a2e" data-color="#c99a2e" aria-label="Dourado" aria-pressed="false"></button>
  <button class="swatch" id="c4" style="--c:#1f8a5b" data-color="#1f8a5b" aria-label="Verde" aria-pressed="false"></button>
  <button class="swatch" id="c5" style="--c:#1d5fd6" data-color="#1d5fd6" aria-label="Azul" aria-pressed="false"></button>
  <button class="swatch" id="c6" style="--c:#7b2ff0" data-color="#7b2ff0" aria-label="Roxo" aria-pressed="false"></button>
  <label class="picker" title="Escolher qualquer cor">
    <input type="color" id="custom" value="#d2141c" aria-label="Escolher qualquer cor">
  </label>
  <span class="sep" aria-hidden="true"></span>
  <button class="btn" id="halftone" aria-label="Ligar ou desligar a retícula" aria-pressed="true" title="Retícula (H)">
    <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="18" cy="6" r="1.6"/><circle cx="6" cy="12" r="2.4"/><circle cx="12" cy="12" r="2.4"/><circle cx="18" cy="12" r="2.4"/><circle cx="6" cy="18" r="3"/><circle cx="12" cy="18" r="3"/><circle cx="18" cy="18" r="3"/></svg>
  </button>
  <button class="btn" id="fs" aria-label="Tela cheia" title="Tela cheia (F)">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</div>
<div class="hint">Teclas 1–6 trocam a cor · H retícula · F tela cheia</div>

<script>
(() => {
  const canvas = document.getElementById('bg');
  const gl = canvas.getContext('webgl', { antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: false });

  const vert = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }`;
  const frag = `
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform vec3 uColor;
uniform float uDot;
uniform float uHalftone;

float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f*f*(3.-2.*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+1.), f.x), f.y);
}
float fbm(vec2 p){
  float v = 0., a = .5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for(int i=0;i<5;i++){ v += a*noise(p); p = m*p; a *= .5; }
  return v;
}
vec3 hueRot(vec3 c, float a){
  const vec3 k = vec3(.57735);
  float ca = cos(a);
  return c*ca + cross(k, c)*sin(a) + k*dot(k, c)*(1.-ca);
}

void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 p = (frag - .5*uRes) / min(uRes.x, uRes.y);
  float t = uTime;
  float T = t*.035;

  // campo fluido (domain warping) — a mancha de luz que se mexe
  vec2 q = vec2(fbm(p*1.1 + vec2(0., T)), fbm(p*1.1 + vec2(5.2, -T)));
  vec2 w = vec2(fbm(p + 1.8*q + vec2(1.7, 9.2) + T*1.2), fbm(p + 1.8*q + vec2(8.3, 2.8) - T*.9));
  float f = fbm(p*.9 + 1.6*w);

  // fonte de luz principal no alto, vagando devagar
  vec2 lp = vec2(-.55 + .35*sin(t*.045), .55 + .2*cos(t*.037));
  float glow = smoothstep(1.75, -.2, length(p - lp + (w-.5)*.5));
  // segunda luz, mais fraca, embaixo à direita
  vec2 lp2 = vec2(.6 + .25*cos(t*.031), -.5 + .2*sin(t*.041));
  float glow2 = smoothstep(1.1, 0., length(p - lp2 + (q-.5)*.6)) * .45;
  // feixe diagonal de luz (como na primeira imagem)
  vec2 bd = normalize(vec2(1., 1.35 + .15*sin(t*.02)));
  float beam = smoothstep(.32, 0., abs(dot(p, bd) + .62 + .12*sin(t*.027) + (f-.5)*.25)) * .55;

  float L = .1 + glow*(.6 + 1.35*f) + glow2*(.3 + f) + beam*(.5 + f);
  L = clamp(L, 0., 1.);

  // paleta derivada da cor escolhida: sombra quase preta -> cor -> realce com leve giro de matiz
  vec3 c = uColor;
  vec3 shadow = c*.07 + vec3(.012, .004, .004);
  vec3 deep = c*.45;
  vec3 high = clamp(hueRot(c, .5)*1.25 + .08, 0., 1.);
  vec3 col = mix(shadow, deep, smoothstep(.0, .35, L));
  col = mix(col, c, smoothstep(.25, .65, L));
  col = mix(col, high, smoothstep(.62, 1., L));

  // listras curvas de "marcador" sob a retícula (segunda imagem)
  vec2 sc = vec2(.35 + .2*sin(t*.023), -.15 + .15*cos(t*.019));
  float rr = length((p - sc)*vec2(1., 1.25));
  float stripes = .5 + .5*sin(rr*15. - t*.25 + (w.x - .5)*5.);
  stripes = smoothstep(.15, .85, stripes);
  float tone = L*(.55 + .55*stripes);

  // retícula a 45° (halftone)
  float cs = uDot;
  vec2 rp = mat2(.7071, -.7071, .7071, .7071) * frag;
  vec2 cell = fract(rp/cs) - .5;
  float d = length(cell);
  float rad = .58*sqrt(clamp(1. - tone, 0., 1.)) + .05;
  float aa = 1.2/cs;
  float dotm = smoothstep(rad + aa, rad - aa, d);
  vec3 dotCol = shadow*.6;
  // nas áreas mais claras o ponto vira um tom quente e claro (o arco bege da imagem)
  dotCol = mix(dotCol, high*1.05, smoothstep(.78, 1., tone*1.05) * stripes);
  vec3 ht = mix(col, dotCol, dotm*.88);
  col = mix(col*(.75 + .35*stripes*L), ht, uHalftone);

  // vinheta
  vec2 uv = frag/uRes;
  float vig = smoothstep(1.25, .35, length((uv - .5)*vec2(1.1, 1.)));
  col *= .7 + .3*vig;

  // granulado animado
  float g = hash(frag + fract(t*7.13)*vec2(91.7, 37.3)) - .5;
  col += g*.075;

  gl_FragColor = vec4(clamp(col, 0., 1.), 1.);
}`;

  function sh(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }

  if (!gl) {
    document.body.style.background = 'radial-gradient(circle at 25% 20%, #e8590c, #a0101a 40%, #120202 85%)';
    return;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vert));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, frag));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const uRes = gl.getUniformLocation(prog, 'uRes');
  const uTime = gl.getUniformLocation(prog, 'uTime');
  const uColor = gl.getUniformLocation(prog, 'uColor');
  const uDot = gl.getUniformLocation(prog, 'uDot');
  const uHalftone = gl.getUniformLocation(prog, 'uHalftone');

  function resize() {
    // limita a resolução interna para manter 60fps em telões 4K
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
    const max = 2560;
    const k = Math.min(1, max / Math.max(w, h));
    w = Math.round(w * k); h = Math.round(h * k);
    canvas.width = w; canvas.height = h;
    gl.viewport(0, 0, w, h);
    gl.uniform2f(uRes, w, h);
    // tamanho do ponto proporcional à tela (~7px numa tela 1080p)
    gl.uniform1f(uDot, Math.max(5, Math.min(w, h) / 105));
  }
  addEventListener('resize', resize);
  resize();

  // ---- cor ----
  const hex2rgb = h => { const n = parseInt(h.slice(1), 16); return [(n>>16&255)/255, (n>>8&255)/255, (n&255)/255]; };
  const lin = c => c.map(v => Math.pow(v, 1.15));
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k, v); } catch(e){} }
  };

  const swatches = [...document.querySelectorAll('.swatch')];
  const custom = document.getElementById('custom');
  let target = lin(hex2rgb('#d2141c'));
  let current = target.slice();

  function setColor(hex, save = true) {
    if (!/^#[0-9a-f]{6}$/i.test(hex)) return;
    target = lin(hex2rgb(hex));
    custom.value = hex.toLowerCase();
    swatches.forEach(s => s.setAttribute('aria-pressed', String(s.dataset.color.toLowerCase() === hex.toLowerCase())));
    if (save) store.set('culto-cor', hex);
  }

  const initial = store.get('culto-cor') || '#d2141c';
  setColor(initial, false);
  current = target.slice();

  swatches.forEach(s => s.addEventListener('click', () => setColor(s.dataset.color)));
  custom.addEventListener('input', e => setColor(e.target.value));

  // ---- retícula ----
  const htBtn = document.getElementById('halftone');
  let htTarget = store.get('culto-reticula') === '0' ? 0 : 1, ht = htTarget;
  htBtn.setAttribute('aria-pressed', String(!!htTarget));
  function toggleHT() {
    htTarget = htTarget ? 0 : 1;
    htBtn.setAttribute('aria-pressed', String(!!htTarget));
    store.set('culto-reticula', String(htTarget));
  }
  htBtn.addEventListener('click', toggleHT);

  // ---- tela cheia ----
  function toggleFS() {
    try {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
      else document.exitFullscreen?.().catch(() => {});
    } catch (e) {}
  }
  document.getElementById('fs').addEventListener('click', toggleFS);

  addEventListener('keydown', e => {
    if (e.target === custom) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= swatches.length) setColor(swatches[n-1].dataset.color);
    else if (e.key === 'f' || e.key === 'F') toggleFS();
    else if (e.key === 'h' || e.key === 'H') toggleHT();
    wake();
  });

  // ---- some sozinho depois de 3s parado (telão) ----
  let idleTimer;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (!document.querySelector('.panel').matches(':hover')) document.body.classList.add('idle');
      else wake();
    }, 3000);
  }
  ['mousemove', 'pointerdown', 'touchstart'].forEach(ev => addEventListener(ev, wake, { passive: true }));
  wake();

  // mantém a tela acesa durante o culto
  async function keepAwake() { try { await navigator.wakeLock?.request('screen'); } catch (e) {} }
  keepAwake();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });

  // ---- loop ----
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const speed = reduce ? .25 : 1;
  let last = performance.now(), time = 40;
  function frame(now) {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    time += dt * speed;
    // transição suave de cor (~1,5s)
    const k = 1 - Math.exp(-dt * 2.2);
    for (let i = 0; i < 3; i++) current[i] += (target[i] - current[i]) * k;
    ht += (htTarget - ht) * k;
    gl.uniform1f(uTime, time);
    gl.uniform3f(uColor, current[0], current[1], current[2]);
    gl.uniform1f(uHalftone, ht);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
