<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fundo Culto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=Inter:wght@400;500&display=swap">
<style>
/* Layout: tela cheia de luz (WebGL), texto opcional no centro, um painel que some sozinho. */
:root {
  --ink: #f7f3ef;
  --ink-dim: rgba(247, 243, 239, .62);
  --panel: rgba(12, 10, 12, .62);
  --panel-line: rgba(255, 255, 255, .12);
  --field: rgba(255, 255, 255, .07);
  --focus: #ffe2c4;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Sora", "Inter", system-ui, sans-serif;
  --text-scale: 1;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: #050404; overflow: hidden; }
body { font-family: var(--font-ui); color: var(--ink); }
body.idle { cursor: none; }
canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

/* ---- texto central ---- */
.stage {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.copy {
  max-width: min(92vw, 1400px);
  text-align: center;
  display: grid; gap: calc(1.2vw * var(--text-scale));
  transition: opacity 1.2s ease, filter 1.2s ease, transform 1.2s ease;
}
.stage[data-on="false"] .copy { opacity: 0; filter: blur(14px); transform: scale(.98); }
.headline {
  margin: 0;
  font-family: var(--font-display); font-weight: 600;
  font-size: calc(clamp(2.2rem, 6.4vw, 9rem) * var(--text-scale));
  line-height: 1.04; letter-spacing: -.02em;
  text-wrap: balance;
  text-shadow: 0 0 40px rgba(255,255,255,.18), 0 2px 30px rgba(0,0,0,.35);
}
.sub {
  margin: 0;
  font-family: var(--font-display); font-weight: 300;
  font-size: calc(clamp(1rem, 2.2vw, 3rem) * var(--text-scale));
  line-height: 1.35; letter-spacing: .01em;
  color: rgba(247, 243, 239, .86);
  text-wrap: balance;
  text-shadow: 0 2px 24px rgba(0,0,0,.4);
}
.sub:empty, .headline:empty { display: none; }

/* ---- painel ---- */
.dock {
  position: fixed;
  right: calc(20px + env(safe-area-inset-right, 0px));
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  left: calc(16px + env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  pointer-events: none;
  transition: opacity .6s ease, transform .6s ease;
}
body.idle .dock { opacity: 0; transform: translateY(12px); }
body.idle .dock * { pointer-events: none !important; }
.dock > * { pointer-events: auto; }

.bar, .editor {
  background: var(--panel);
  border: 1px solid var(--panel-line);
  backdrop-filter: blur(16px) saturate(1.3);
  -webkit-backdrop-filter: blur(16px) saturate(1.3);
}
.bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end;
  padding: 10px 12px; border-radius: 999px; max-width: 100%;
}
.swatch, .picker, .btn {
  width: 34px; height: 34px; border-radius: 50%;
  border: 2px solid transparent; padding: 0; cursor: pointer; outline-offset: 3px;
}
.swatch { background: var(--c); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); transition: transform .2s ease; }
.swatch:hover { transform: scale(1.12); }
.swatch[aria-pressed="true"] { border-color: var(--ink); }
.swatch:focus-visible, .btn:focus-visible, .picker:focus-within, .field:focus-visible, .switch input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.picker {
  position: relative; overflow: hidden;
  background: conic-gradient(#ff3b30, #ff9500, #ffcc00, #34c759, #00c7be, #007aff, #af52de, #ff2d55, #ff3b30);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
}
.picker input { position: absolute; inset: -8px; width: 150%; height: 150%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.sep { width: 1px; height: 22px; background: var(--panel-line); }
.btn { background: transparent; color: var(--ink-dim); display: grid; place-items: center; font: 600 14px/1 var(--font-display); }
.btn:hover, .btn[aria-expanded="true"] { color: var(--ink); background: rgba(255,255,255,.1); }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.editor {
  width: min(380px, 100%);
  border-radius: 18px; padding: 16px;
  display: grid; gap: 12px;
}
.editor-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.editor-head strong { font: 500 13px/1 var(--font-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim); }
.editor label.lbl { display: grid; gap: 6px; font-size: 12px; color: var(--ink-dim); letter-spacing: .02em; }
.field {
  width: 100%; box-sizing: border-box;
  background: var(--field); color: var(--ink);
  border: 1px solid var(--panel-line); border-radius: 10px;
  padding: 10px 12px; font: 400 15px/1.35 var(--font-ui);
  resize: vertical;
}
.field::placeholder { color: rgba(247,243,239,.35); }
.row { display: flex; align-items: center; gap: 10px; }
.row input[type="range"] { flex: 1; accent-color: var(--ink); }

.switch { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--ink); }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch span { width: 40px; height: 22px; border-radius: 999px; background: rgba(255,255,255,.18); position: relative; transition: background .25s ease; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); transition: transform .25s ease; }
.switch input:checked + span { background: rgba(255,255,255,.55); }
.switch input:checked + span::after { transform: translateX(18px); background: #111; }

.hint {
  position: fixed;
  left: calc(20px + env(safe-area-inset-left, 0px));
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  font-size: 12px; letter-spacing: .04em; color: var(--ink-dim);
  transition: opacity .6s ease;
}
body.idle .hint, body.editing .hint { opacity: 0; }
@media (max-width: 900px) { .hint { display: none; } }
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>

<div class="stage" id="stage" data-on="false">
  <div class="copy">
    <h1 class="headline" id="outHead"></h1>
    <p class="sub" id="outSub"></p>
  </div>
</div>

<div class="dock">
  <form class="editor" id="editor" hidden>
    <div class="editor-head">
      <strong>Texto na tela</strong>
      <label class="switch" for="showText">
        <input type="checkbox" id="showText">
        <span aria-hidden="true"></span>
        Mostrar
      </label>
    </div>
    <label class="lbl" for="inHead">Headline
      <input class="field" id="inHead" type="text" placeholder="Ex.: Bem-vindos à casa" autocomplete="off">
    </label>
    <label class="lbl" for="inSub">Subheadline
      <textarea class="field" id="inSub" rows="2" placeholder="Ex.: Culto de Celebração · Domingo, 19h"></textarea>
    </label>
    <label class="lbl" for="size">Tamanho do texto
      <span class="row"><input type="range" id="size" min="0.6" max="1.6" step="0.05" value="1"></span>
    </label>
  </form>

  <div class="bar" role="toolbar" aria-label="Controles do fundo">
    <button class="swatch" id="c1" style="--c:#e0301e" data-color="#e0301e" aria-label="Vermelho" aria-pressed="false"></button>
    <button class="swatch" id="c2" style="--c:#f07a2a" data-color="#f07a2a" aria-label="Laranja" aria-pressed="false"></button>
    <button class="swatch" id="c3" style="--c:#d4a548" data-color="#d4a548" aria-label="Dourado" aria-pressed="false"></button>
    <button class="swatch" id="c4" style="--c:#3a9e8f" data-color="#3a9e8f" aria-label="Verde-água" aria-pressed="false"></button>
    <button class="swatch" id="c5" style="--c:#2f6fd8" data-color="#2f6fd8" aria-label="Azul" aria-pressed="false"></button>
    <button class="swatch" id="c6" style="--c:#8a4bf0" data-color="#8a4bf0" aria-label="Roxo" aria-pressed="false"></button>
    <label class="picker" title="Escolher qualquer cor">
      <input type="color" id="custom" value="#e0301e" aria-label="Escolher qualquer cor">
    </label>
    <span class="sep" aria-hidden="true"></span>
    <button class="btn" id="textBtn" type="button" aria-expanded="false" aria-controls="editor" title="Texto (T liga/desliga)">Aa</button>
    <button class="btn" id="fs" type="button" aria-label="Tela cheia" title="Tela cheia (F)">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</div>
<div class="hint">1–6 trocam a cor · T mostra o texto · F tela cheia</div>

<script>
(() => {
  const canvas = document.getElementById('bg');
  const gl = canvas.getContext('webgl', { antialias: false });

  const vert = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }`;
  const frag = `
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform vec3 uColor;

float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f*f*(3.-2.*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+1.), f.x), f.y);
}
float fbm(vec2 p){
  float v = 0., a = .5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for(int i=0;i<4;i++){ v += a*noise(p); p = m*p; a *= .5; }
  return v;
}
vec3 hueRot(vec3 c, float a){
  const vec3 k = vec3(.57735);
  float ca = cos(a);
  return c*ca + cross(k, c)*sin(a) + k*dot(k, c)*(1.-ca);
}
float blob(vec2 p, vec2 c, float r){ vec2 d = p - c; return exp(-dot(d,d)/(r*r)); }

// curva infinita: soma de senos + ruído lento
float curve(float x, float t, vec4 k){
  // k: amplitude, frequência, velocidade, fase
  return k.x*sin(x*k.y + t*k.z + k.w)
       + k.x*.45*sin(x*k.y*1.87 - t*k.z*.63 + k.w*1.7)
       + (noise(vec2(x*.7 + k.w, t*.06)) - .5)*.35;
}
// feixe de luz fino: núcleo brilhante + halo largo, com espessura que varia ao longo da curva
float ribbon(vec2 p, float t, vec4 k, float off, float w){
  float y = off + curve(p.x, t, k);
  float y2 = off + curve(p.x + .01, t, k);
  float s = (y2 - y)/.01;
  float d = abs(p.y - y)/sqrt(1. + s*s);
  float taper = .35 + .9*smoothstep(-.2, 1., sin(p.x*1.3 + t*.11 + k.w*3.));
  float ww = w*taper;
  return exp(-d*d/(ww*ww)) + .55*exp(-d/(ww*7.)) + .25*exp(-d/(ww*28.));
}

void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 p = (frag - .5*uRes) / min(uRes.x, uRes.y);
  float t = uTime;

  vec3 c = uColor;
  vec3 light = mix(c, vec3(1.), .55);           // centro quase branco (imagem azul)
  vec3 warm  = clamp(hueRot(c, .24)*1.15, 0., 1.); // vizinho de matiz (laranja do vermelho)
  vec3 dusk  = mix(c, vec3(.5, .48, .46), .7)*.55; // cinza tingido (topo da imagem laranja)

  // respiração cinematográfica: brilho sobe e desce, com "flares" ocasionais
  float breath = .78 + .22*sin(t*.33) + .1*sin(t*.71 + 1.3);
  float flare = pow(noise(vec2(t*.09, 7.3)), 3.)*1.6;
  float pulse = breath + flare;

  // campo suave distorcido
  vec2 wp = p + (vec2(fbm(p*.9 + t*.03), fbm(p*.9 - t*.025 + 4.)) - .5)*.9;

  vec3 col = c*.035 + vec3(.012, .011, .013);
  col += dusk  * blob(wp, vec2(.15*sin(t*.05), .85 + .1*cos(t*.04)), .7) * .55;
  col += c     * blob(wp, vec2(.6 + .2*sin(t*.043), .05 + .25*cos(t*.051)), .42) * .7;
  col += warm  * blob(wp, vec2(-.75 + .15*cos(t*.037), -.2 + .2*sin(t*.047)), .36) * .9 * pulse;
  col += light * blob(wp, vec2(-1. + .12*sin(t*.06), .02 + .3*sin(t*.029)), .3) * .95 * pulse;
  col *= .75 + .5*fbm(wp*1.4 + t*.02);
  // área de sombra profunda que passeia
  col *= 1. - .85*blob(wp, vec2(.2 + .35*cos(t*.031), -.4 + .2*sin(t*.04)), .6);
  col *= 1. - .7*blob(wp, vec2(.1 + .3*sin(t*.027), .45 + .15*cos(t*.035)), .45);

  // feixes de luz (raios) vindos de uma fonte fora da tela
  vec2 src = vec2(-1.3 + .2*sin(t*.04), 1.1);
  vec2 v = p - src;
  float ang = atan(v.y, v.x);
  float rays = pow(noise(vec2(ang*9., t*.12)), 2.2)*.8 + pow(noise(vec2(ang*23. + 3., t*.2)), 3.)*.5;
  rays *= smoothstep(2.8, .4, length(v)) * (.4 + .6*breath);
  col += mix(c, light, .4) * rays * .18;

  // traços infinitos de luz
  float r1 = ribbon(p, t, vec4(.28, 1.6, .22, 0.), -.18, .010);
  float r2 = ribbon(p, t, vec4(.22, 2.1, -.17, 2.1), .12, .006);
  float r3 = ribbon(p, t, vec4(.35, 1.1, .12, 4.4), -.42, .016);
  float pulse1 = .55 + .45*sin(t*.41) + flare;
  float pulse2 = .55 + .45*sin(t*.29 + 2.) + flare*.6;
  float pulse3 = .55 + .45*sin(t*.23 + 4.);
  col += mix(warm, light, .35) * r1 * .55 * pulse1;
  col += mix(c, light, .6)     * r2 * .45 * pulse2;
  col += c                     * r3 * .5  * pulse3;

  // vinheta
  vec2 uv = frag/uRes;
  col *= .25 + .75*smoothstep(1.2, .3, length((uv - .5)*vec2(1.15, 1.)));

  // tone map filmico (brilho estoura com suavidade)
  col = 1. - exp(-col*1.2*(.9 + .1*pulse));
  col = pow(col, vec3(.95));

  // granulado
  float g = hash(frag + fract(t*7.13)*vec2(91.7, 37.3)) - .5;
  col += g*.06;

  gl_FragColor = vec4(clamp(col, 0., 1.), 1.);
}`;

  if (!gl) {
    document.body.style.background = 'radial-gradient(circle at 15% 50%, #f3d2c0, #e0301e 35%, #120404 85%)';
  } else {
    const sh = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
      return s;
    };
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vert));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, frag));
    gl.linkProgram(prog);
    gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'a');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    var uRes = gl.getUniformLocation(prog, 'uRes');
    var uTime = gl.getUniformLocation(prog, 'uTime');
    var uColor = gl.getUniformLocation(prog, 'uColor');
  }

  function resize() {
    if (!gl) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    let w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
    const k = Math.min(1, 2200 / Math.max(w, h)); // luz suave: não precisa de resolução total
    w = Math.round(w * k); h = Math.round(h * k);
    canvas.width = w; canvas.height = h;
    gl.viewport(0, 0, w, h);
    gl.uniform2f(uRes, w, h);
  }
  addEventListener('resize', resize);
  resize();

  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k, v); } catch(e){} }
  };

  // ---- cor ----
  const hex2rgb = h => { const n = parseInt(h.slice(1), 16); return [(n>>16&255)/255, (n>>8&255)/255, (n&255)/255]; };
  const swatches = [...document.querySelectorAll('.swatch')];
  const custom = document.getElementById('custom');
  let target = hex2rgb('#e0301e'), current = target.slice();
  function setColor(hex, save = true) {
    if (!/^#[0-9a-f]{6}$/i.test(hex)) return;
    target = hex2rgb(hex);
    custom.value = hex.toLowerCase();
    swatches.forEach(s => s.setAttribute('aria-pressed', String(s.dataset.color.toLowerCase() === hex.toLowerCase())));
    if (save) store.set('culto-cor', hex);
  }
  setColor(store.get('culto-cor') || '#e0301e', false);
  current = target.slice();
  swatches.forEach(s => s.addEventListener('click', () => setColor(s.dataset.color)));
  custom.addEventListener('input', e => setColor(e.target.value));

  // ---- texto ----
  const editor = document.getElementById('editor');
  const textBtn = document.getElementById('textBtn');
  const stage = document.getElementById('stage');
  const inHead = document.getElementById('inHead');
  const inSub = document.getElementById('inSub');
  const showText = document.getElementById('showText');
  const size = document.getElementById('size');
  const outHead = document.getElementById('outHead');
  const outSub = document.getElementById('outSub');

  inHead.value = store.get('culto-head') ?? 'Bem-vindos à casa';
  inSub.value = store.get('culto-sub') ?? 'Culto de Celebração · Domingo, 19h';
  showText.checked = store.get('culto-show') === '1';
  size.value = store.get('culto-size') || '1';

  function renderText() {
    outHead.textContent = inHead.value.trim();
    outSub.textContent = inSub.value.trim();
    stage.dataset.on = String(showText.checked);
    document.documentElement.style.setProperty('--text-scale', size.value);
    store.set('culto-head', inHead.value);
    store.set('culto-sub', inSub.value);
    store.set('culto-show', showText.checked ? '1' : '0');
    store.set('culto-size', size.value);
  }
  [inHead, inSub, size].forEach(el => el.addEventListener('input', renderText));
  showText.addEventListener('change', renderText);
  editor.addEventListener('submit', e => e.preventDefault());
  renderText();

  function toggleEditor(open = editor.hidden) {
    editor.hidden = !open;
    textBtn.setAttribute('aria-expanded', String(open));
    document.body.classList.toggle('editing', open);
    if (open) inHead.focus();
  }
  textBtn.addEventListener('click', () => toggleEditor());

  // ---- tela cheia ----
  function toggleFS() {
    try {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
      else document.exitFullscreen?.().catch(() => {});
    } catch (e) {}
  }
  document.getElementById('fs').addEventListener('click', toggleFS);

  addEventListener('keydown', e => {
    const typing = e.target.matches('input[type="text"], textarea');
    if (e.key === 'Escape') { toggleEditor(false); e.target.blur?.(); wake(); return; }
    if (typing) { wake(); return; }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= swatches.length) setColor(swatches[n-1].dataset.color);
    else if (e.key === 'f' || e.key === 'F') toggleFS();
    else if (e.key === 't' || e.key === 'T') { showText.checked = !showText.checked; renderText(); }
    wake();
  });

  // ---- controles somem depois de 3s parado ----
  let idleTimer;
  const dock = document.querySelector('.dock');
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      const busy = dock.matches(':hover') || dock.contains(document.activeElement) && document.activeElement !== document.body && !editor.hidden;
      if (busy) wake(); else document.body.classList.add('idle');
    }, 3000);
  }
  ['mousemove', 'pointerdown', 'touchstart'].forEach(ev => addEventListener(ev, wake, { passive: true }));
  wake();

  async function keepAwake() { try { await navigator.wakeLock?.request('screen'); } catch (e) {} }
  keepAwake();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });

  // ---- loop ----
  if (!gl) return;
  const speed = matchMedia('(prefers-reduced-motion: reduce)').matches ? .3 : 1;
  let last = performance.now(), time = 30;
  function frame(now) {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    time += dt * speed;
    const k = 1 - Math.exp(-dt * 2);
    for (let i = 0; i < 3; i++) current[i] += (target[i] - current[i]) * k;
    gl.uniform1f(uTime, time);
    gl.uniform3f(uColor, current[0], current[1], current[2]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
